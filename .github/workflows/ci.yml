name: Continuous Integration & Testing

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install system dependencies for OCR
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr poppler-utils

    - name: Install application dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pydantic-settings httpx

    - name: Create baseline directory structure
      run: |
        mkdir -p data/chroma_db data/uploads sample_documents
        cp .env.example .env

    - name: Execute Core Engine Tests
      run: |
        python -m pytest tests/test_processor.py tests/test_feedback.py -v

    - name: Execute Network API Integration Tests
      run: |
        python -m pytest tests/test_api.py -v
